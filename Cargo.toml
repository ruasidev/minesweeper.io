# The parts of the game written in Rust (see "Board generation" in the README)

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# What is shipped: built for speed, and with nothing in it that isn't used
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The tests check every step the solver takes against where the mines really are (debug assertions), over a great
# many boards: optimised, that takes seconds rather than minutes
[profile.test]
opt-level = 2
